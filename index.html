<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Judul & description diisi dari data.json (PROFILE) oleh js/loadData.js -->
  <meta name="description" content="">
  <title></title>

  <!-- Favicon -->
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="manifest" href="./site.webmanifest">
  <meta name="theme-color" content="#fafafa">

  <link rel="stylesheet" href="./css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Inter = Neue Montreal (UI) · Fraunces = Louize Display/Louize (serif)
       Antonio = Manuka (ultra-condensed masthead) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Antonio:wght@400&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@400;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <!-- Top ticker banner — full-bleed announcement strip -->
  <!-- <div class="ticker-banner" id="ticker_banner"></div> -->

  <header>
    <nav>
      <span class="nav-title" id="nav_title"></span>
      <!-- Daftar tautan dirender navSection() dari NAV.LINKS -->
      <ul class="nav-links" id="nav_links"></ul>
      <button class="nav-cta" id="nav_cta" onclick="scrollElement('contact')"></button>
      <button type="button" class="hamburger" aria-label="Buka menu" aria-expanded="false"
        aria-controls="nav_links">
        <span class="line"></span>
        <span class="line"></span>
        <span class="line"></span>
      </button>
    </nav>
  </header>

  <!-- Hero — display serif headline left, monochrome plate right -->
  <section id="home" class="hero">
    <div class="hero-copy">
      <span class="hero-eyebrow reveal" data-reveal-delay="0" id="hero_eyebrow"></span>
      <h1 class="hero-name reveal" data-reveal-delay="90" id="hero_name"></h1>
      <p class="hero-description reveal" data-reveal-delay="180" id="home_description"></p>
      <div class="hero-actions reveal" data-reveal-delay="270">
        <button class="btn" id="download-btn"></button>
        <button class="btn btn--ghost" id="hero_cta_secondary" onclick="scrollElement('contact')"></button>
      </div>
    </div>
    <!-- src & alt diisi profileSection() dari PROFILE/HOME — tidak ada
         nilai statis di sini.
         .hero-plate memegang tanda potong + sudut tajam; .hero-plate-inner
         yang meng-clip gambar, supaya tanda potongnya boleh keluar bidang.
         Dua lapisan bertumpuk: foto asli sebagai keadaan diam, halftone
         sebagai keadaan hover. Lapisan halftone murni hiasan (teksnya sudah
         ada di foto), jadi aria-hidden. -->
    <div class="hero-plate reveal" data-reveal-delay="360">
      <div class="hero-plate-inner">
        <img class="hero-plate-photo" alt="">
        <img class="hero-plate-halftone" alt="" aria-hidden="true">
      </div>
    </div>
  </section>

  <!-- Tech ticker — full-bleed Ink marquee of the stack -->
  <div class="tech-ticker" aria-hidden="true">
    <div class="tech-ticker-track" id="tech_ticker_track"></div>
  </div>

  <section id="experience">
    <div class="section-head reveal">
      <h2 class="section-title" id="section_title_experience"></h2>
    </div>
    <!-- Diisi dua sub-section terpisah: Contract / Professional dan Freelance -->
    <div class="experience-groups" id="experience_list"></div>
  </section>

  <section id="education">
    <div class="section-head reveal">
      <h2 class="section-title" id="section_title_education"></h2>
    </div>
    <div class="education-container" id="education_list"></div>
  </section>

  <section id="skills">
    <div class="section-head reveal">
      <h2 class="section-title" id="section_title_skills"></h2>
    </div>
    <div class="skills-grid">
      <div class="skills-item-container reveal">
        <h3 id="label_skill_hard"></h3>
        <div class="skills-content" id="hardskill_list"></div>
      </div>
      <div class="skills-item-container reveal">
        <h3 id="label_skill_other"></h3>
        <div class="skills-content" id="other_list"></div>
      </div>
      <div class="skills-item-container reveal">
        <h3 id="label_skill_soft"></h3>
        <div class="skills-content-soft" id="softskill_list"></div>
      </div>
    </div>
  </section>

  <section id="project">
    <div class="section-head section-head--rail reveal">
      <h2 class="section-title" id="section_title_project"></h2>
      <div class="rail-nav" data-rail-nav-for="project_list">
        <button type="button" class="rail-btn" data-rail="prev" aria-controls="project_list"
          aria-label="Geser proyek ke kiri">←</button>
        <button type="button" class="rail-btn" data-rail="next" aria-controls="project_list"
          aria-label="Geser proyek ke kanan">→</button>
      </div>
    </div>
    <div class="card-container card-container--projects card-container--rail reveal" id="project_list" tabindex="0"
      aria-label="Daftar proyek, geser ke kanan atau kiri"></div>
  </section>

  <section id="contact" class="contact">
    <div class="contact-block reveal">
      <span class="letter-eyebrow" id="contact_get_in_touch"></span>
      <div class="contact-links" id="contact_list"></div>
    </div>
    <div class="contact-block reveal">
      <span class="letter-eyebrow" id="contact_note"></span>
      <p class="letter-body" id="contact_description"></p>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-inner">
      <span id="footer_copyright"></span>
      <button type="button" class="footer-top" id="footer_back_to_top" onclick="scrollToTop()"></button>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./js/loadData.js"></script>
  <script src="./js/utilities.js"></script>
  <script src="./js/interactions.js"></script>
  <script src="./js/index.js"></script>
</body>

</html>
